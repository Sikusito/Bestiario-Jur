<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bestiario</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    margin:0;

    width:800px;
    height:560px;

    overflow:hidden;

    background:#2c1b0f;

    display:flex;
    flex-direction:column;
    align-items:center;

    font-family:'Cormorant Garamond', serif;
}

.book{

    position:relative;

    width:800px;
    height:560px;

    background-image:
    url("https://i.imgur.com/IlMUZ46.jpeg");

    background-size:cover;
    background-position:center;

    margin:0;
}

.friendship{

    text-align:center;

    font-size:20px;

    margin-top:-15px;

    margin-bottom:5px;

    letter-spacing:4px;
}

.heart-full{

    color:#8b0000;
}

.heart-empty{

    color:#b8a58c;
}

/* =====================
   ZONAS DE LAS PÁGINAS
===================== */

.left-page{

    position:absolute;

    left:112px;
    top:72px;

    width:254px;
    height:394px;
    
    overflow:hidden;

    display:block;
}

.left-page img{

    width:100%;
    height:100%;

    object-fit:cover;

    transform:rotate(4deg) scale(1.06);

    filter:
        sepia(80%)
        saturate(80%)
        contrast(90%)
        brightness(92%);

    box-shadow:
        0 8px 18px rgba(0,0,0,0.35);

}

.right-page{

    position:absolute;

    left:432px;
    top:60px;

    width:256px;
    height:432px;

    padding-left:28px;
    padding-right:12px;

    overflow:hidden;

    color:#2f2416;
}

.title{

    font-family:'Old English Text MT', serif;
    font-size:24px;
    font-weight:700;
    line-height:1;
    margin-top: 15px;
    margin-bottom:12px;
    text-align:center;
    color:#1f1810;
}

.section{

    margin-bottom:18px;
}

.section-title{

    font-family:'Cincel';
    font-size:18px;
    font-weight:700;
    letter-spacing:1px;
    margin-bottom:8px;
    color:#5b3d1a;
    padding-left:8px;
}

.section-content{

    font-size:14px;
    padding-left:8px;
    margin-bottom:18px;
}

.description{

    margin-top:25px;
    font-size:14px;
    line-height:1.55;
    padding-left:8px;
}

/* =====================
      PORTADA
===================== */

.cover{

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    height:100%;
}

.cover h1{

    font-family:'Old English Text MT';

    font-size:20px;

    margin-bottom:20px;
}

.cover h2{

    font-size:20px;

    margin-bottom:35px;
}

.cover p{

    max-width:500px;

    font-size:18px;

    line-height:1.5;
}

.cover-page{

    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    text-align:center;

    color:#2f2416;
}

.cover-page h1{

    font-family:'Old English Text MT';

    font-size:20px;

    margin-top:20px;

    margin-bottom:25px;
}

.cover-page h2{

    font-size:20px;

    margin-bottom:25px;

    font-weight:normal;
}

.cover-text{

    width:250px;

    font-size:20px;

    line-height:1.8;
}

/* =====================
      BOTONES
===================== */

.controls{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    pointer-events:auto;
}

.controls button{
    position:absolute;
}

.prev-btn{

    left:188px;
    top:480px;
}

.next-btn{

    left:524px;
    top:476px;
}
button{

    padding:10px 18px;

    border:none;

    background:#4f3119;

    color:#f0d7a4;

    cursor:pointer;

    border-radius:6px;

    font-family:'Cinzel', serif;
}

button:hover{

    background:#694123;
}

.page-number{

    color:#f0d7a4;

    font-family:'Cinzel', serif;
}

/* Animación */

.fade{

    animation:fade 0.25s;
}

@keyframes fade{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }
}

.creature-table{

    width:100%;

    border-collapse:collapse;

    margin-top:10px;

    font-size:12px;
}



.creature-table tr{

    border-bottom:1px solid rgba(80,60,30,0.15);
}

.creature-table td{

    padding:4px 0;
    vertical-align:top;
}

.creature-table td:first-child{

    width:45%;

    font-weight:700;

    color:#5b3d1a;
}

.creature-table td:last-child{

    width:55%;
}

</style>
</head>
<body>


<div class="book fade" id="book">

    <div class="left-page" id="leftPage"></div>

    <div class="right-page" id="rightPage"></div>

    <div class="controls">

        <button class="prev-btn" onclick="previousPage()">
            ◄ Anterior
        </button>

        <button class="next-btn" onclick="nextPage()">
            Siguiente ►
        </button>

    </div>

</div>

<script>

const bestiary = [



{
    cover:true,

    leftTitle:"Bestiario de Jur W. Klopp",

    leftText:`
	Estudio exhaustivo de las Criaturas Mágicas encontradas por Jur W. Klopp con la finalidad de entender su naturaleza más a fondo.`,

    rightTitle:"Prólogo",

    rightSubtitle:"",

    rightText:`
	Todo lo plasmado en este documento está basado en impresiones del propio Slytherin.
`
},

{
    title:"Doxy",
    friendship:3,
    date:"11/05/2026",
    image:"https://i.gyazo.com/ff365fd655302c537f25e9bb628abf12.png",
    classification:"Poco Cómun — XX",
    nickname:"DDoS",
    race:"Doxy",
    habitat:"Europa y América del Norte, en regiones de clima frío.",
    food:"Se alimentan de pequeños insectos: como moscas, zancudos o mosquitos, a los que paralizan con su veneno sedante.",
    data:"Se instalan en las cortinas de las casas. En época de cría, pueden llegar a depositar hasta quinientos huevos."
},

{
    title:"Gnomo",
    friendship:1,
    date:"18/05/2026",
    image:"https://i.gyazo.com/7b13bc25206b3580d043c5e13991ed0a.png",
    classification:"Común — X",
    nickname:"David",
    race:"Gnomo",
    habitat:"Viven en madrigueras alrededor de Europa y Norteamérica.",
    food:"Raíces de plantas, lo que provoca verdaderos desastres en los jardines.",
    data:"Les gusta ser perseguidos y correr grandes distancias como consecuencia. Su tez de piel es de color marrón y sus piernas son parecidas a una patata, los pies tienen un aspecto huesudo."
},

{
    title:"Diablillo",
    friendship:1,
    date:"25/05/2026",
    image:"https://i.gyazo.com/00f334fd9a6a08314300106c9c8517d0.png",
    classification:"Común — X",
    nickname:"No posee",
    race:"Imp.",
    habitat:"Se encuentra en las regiones pantanosas de Irlanda y Gran Bretaña, concretamente en las ciénagas.",
    food:"Tiene predilección por insectos autóctonos.",
    data:"Las crías que nacen de los huevos del Imp son muy similares a su progenitor, como si fueran copias generadas por la primera criatura."
},

{
    title:"Augurey",
    friendship:1,
    date:"01/06/2026",
    image:"https://i.gyazo.com/95f9c87300ebb5137e8d483977a2f511.png",
    classification:"Común — X",
    nickname:"Redemption",
    race:"Augurey",
    habitat:"Anida en las zarzas y espinos de Gran Bretaña e Irlanda, aunque también se han avistado en otras zonas del Norte de Europa.",
    food:"Se alimenta de insectos de un tamaño considerable y de hadas.",
    data:"Los nidos de esta criatura presentan forma de lágrima y cierto personaje histórico tuvo cincuenta ejemplares como mascota."
},

{
    title:"Grindylow",
    friendship:1,
    date:"08/06/2026",
    image:"https://i.gyazo.com/b722ceabc71caeede0fb6945e3f8f4ff.png",
    classification:"Común — X",
    nickname:"Squiward",
    race:"Grindylow",
    habitat:"Residen entre las algas de los lagos de Reino Unido e Irlanda.",
    food:"Se alimenta de pequeños peces que encuentra en el entorno.",
    data:"La gente del agua los utiliza como mascotas, ya que conoce la forma más eficiente de derrotarlos. Sus dedos son el punto más débil de estas criaturas, pues son muy quebradizos."
},
];

let currentPage = 0;

const leftPage =
document.getElementById("leftPage");

const rightPage =
document.getElementById("rightPage");



const book =
document.getElementById("book");

function renderPage(){

    const page = bestiary[currentPage];

    book.classList.remove("fade");

    void book.offsetWidth;

    book.classList.add("fade");

if(page.cover){

    leftPage.innerHTML = `

        <div class="cover-page">

            <h1>${page.leftTitle}</h1>

            <div class="cover-text">

                ${page.leftText}

            </div>

        </div>

    `;

    rightPage.innerHTML = `

        <div class="cover-page">

            <h1>${page.rightTitle}</h1>

            <h2>${page.rightSubtitle}</h2>

            <div class="cover-text">

                ${page.rightText}

            </div>

        </div>

    `;


    }else{

        leftPage.innerHTML = `
            <img src="${page.image}">
        `;

rightPage.innerHTML = `

<div class="title">
    ${page.title}
</div>

<div class="friendship">
    ${renderHearts(page.friendship || 0)}
</div>

    <table class="creature-table">

        <tr>
            <td>Obtención</td>
            <td>${page.date || "-"}</td>
        </tr>

        <tr>
            <td>Clasificación</td>
            <td>${page.classification || "-"}</td>
        </tr>

        <tr>
            <td>Apodo</td>
            <td>${page.nickname || "-"}</td>
        </tr>

        <tr>
            <td>Raza</td>
            <td>${page.race || "-"}</td>
        </tr>

        <tr>
            <td>Hábitat</td>
            <td>${page.habitat || "-"}</td>
        </tr>

        <tr>
            <td>Alimento</td>
            <td>${page.food || "-"}</td>
        </tr>

        <tr>
            <td>Datos Curiosos</td>
            <td>${page.data || "-"}</td>
        </tr>

    </table>

`;

}
}

function nextPage(){

    if(currentPage < bestiary.length - 1){

        currentPage++;

        renderPage();
    }
}

function previousPage(){

    if(currentPage > 0){

        currentPage--;

        renderPage();
    }
}

function renderHearts(level){

    let hearts = "";

    for(let i = 1; i <= 5; i++){

        hearts += i <= level
            ? '<span class="heart-full">♥</span>'
            : '<span class="heart-empty">♡</span>';
    }

    return hearts;
}

renderPage();

</script>

</body>
</html>
